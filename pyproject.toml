[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_mini_talkie"
version = "0.1.0"
authors = [{ name = "09Catho" }]
description = "Reachy Mini speaks like a 1930 BBC wireless broadcaster — Talkie-1930 LM + Kokoro British TTS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "reachy-mini>=1.7.1",
  "gradio-client>=1.13.3",
  "faster-whisper>=1.0.3",
  "kokoro>=0.9.2",
  "soundfile>=0.12",
  "scipy>=1.11",
  "numpy>=1.24",
]

[project.optional-dependencies]
sim = ["reachy-mini[mujoco]>=1.7.1"]
dev = ["pytest>=8"]

[project.scripts]
reachy-mini-talkie = "reachy_mini_talkie.main:main"

[project.entry-points."reachy_mini_apps"]
reachy_mini_talkie = "reachy_mini_talkie.main:TalkieApp"

[project.urls]
Homepage = "https://huggingface.co/spaces/09Catho/reachy-mini-talkie"
Repository = "https://github.com/09Catho/reachy-mini-talkie"
"Bug Tracker" = "https://github.com/09Catho/reachy-mini-talkie/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["reachy_mini_talkie*"]
